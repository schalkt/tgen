<!doctype html>
<html lang="en">
	<head>
		<title>Seamless texture generator</title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="author" content="Tamas Schalk" />
		<meta name="robots" content="index, follow" />
		<link type="text/css" rel="stylesheet" media="all" href="/generator/demo/css/index.css" />
		<meta property="og:title" content="Seamless texture generator" />
		<meta property="og:url" content="https://texture-generator.com/generator/" />
		<meta property="og:image" content="https://texture-generator.com/img/share.jpg" />
	</head>

	<body>
		<aside class="menu unselectable">
			<header class="menu-brand">
				<h1>Seamless texture generator</h1>
				<p class="menu-meta">
					<a rel="noopener noreferrer" target="_blank" href="https://github.com/schalkt/tgen">tgen</a>
					<span class="tgen-version"></span>
				</p>
			</header>

			<section class="menu-section">
				<label for="presets">Preset</label>
				<select id="presets">
					<option value="random">random preset</option>
					<option value="editor">editor</option>
				</select>
			</section>

			<section class="menu-section menu-actions">
				<div class="generate button button-primary">Generate</div>
				<div class="editor button">Editor</div>
				<div class="gallery button">Gallery</div>
				<div class="history button">History <span class="history-count">0</span></div>
				<div class="upload button">Upload</div>
				<div class="sure">
					<span class="ok button">Ok</span>
					<span class="cancel button">Cancel</span>
				</div>
				<div class="3d button">3D preview</div>
			</section>

			<section class="menu-section menu-preview">
				<div class="preview-frame">
					<button type="button" class="preview-thumb" disabled aria-label="Open full size preview">
						<img class="preview-thumb-image" alt="Generated texture preview" hidden />
						<span class="preview-placeholder">Generate to preview</span>
					</button>
					<span class="preview-spinner" aria-hidden="true"></span>
					<button type="button" class="preview-download download" disabled aria-label="Download PNG" title="Download PNG">
						<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
							<path d="M12 3v10.2M8.5 10.5 12 14l3.5-3.5M5 18h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
					</button>
				</div>
				<label for="texture-size">Size</label>
				<select id="texture-size">
					<option value="16">16 × 16</option>
					<option value="32">32 × 32</option>
					<option value="64">64 × 64</option>
					<option value="128">128 × 128</option>
					<option value="256" selected>256 × 256</option>
					<option value="512">512 × 512</option>
					<option value="1024">1024 × 1024</option>
					<option value="2048">2048 × 2048</option>
				</select>
			</section>

			<section class="menu-section menu-donate">
				<div class="donate-badges">
					<a rel="noopener noreferrer" target="_blank" href="https://www.paypal.me/schalkt" title="Donate via PayPal">
						<img src="https://img.shields.io/badge/donate-paypal-00457c.svg?logo=paypal&amp;style=flat-square" alt="Donate via PayPal" />
					</a>
					<a rel="noopener noreferrer" target="_blank" href="https://revolut.me/tams9imtf" title="Donate via Revolut">
						<img src="https://img.shields.io/badge/donate-revolut-d82c7b?logo=revolut&amp;logoColor=fff&amp;style=flat-square" alt="Donate via Revolut" />
					</a>
					<a rel="noopener noreferrer" target="_blank" href="https://liberapay.com/schalkt/" title="Donate via Liberapay">
						<img src="https://img.shields.io/badge/donate-liberapay-f6c915?logo=liberapay&amp;logoColor=f6c915&amp;style=flat-square" alt="Donate via Liberapay" />
					</a>
				</div>
			</section>

			<footer class="menu-footer">
				&copy; 2015–2026
				<a rel="noopener noreferrer" target="_blank" href="https://github.com/schalkt/">tamas.schalk</a>
			</footer>
		</aside>

		<div id="preview-lightbox" class="preview-lightbox" aria-hidden="true">
			<div class="preview-lightbox-backdrop"></div>
			<div class="preview-lightbox-dialog" role="dialog" aria-modal="true" aria-label="Texture preview">
				<button type="button" class="preview-lightbox-close gallery-close" aria-label="Close preview">&times;</button>
				<img class="preview-lightbox-image" alt="Generated texture full size" />
				<button type="button" class="preview-lightbox-download download">download</button>
			</div>
		</div>

		<div id="gallery" class="gallery-modal" aria-hidden="true">
			<div class="gallery-backdrop"></div>
			<div class="gallery-dialog" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
				<header class="gallery-header">
					<h2 id="gallery-title">Gallery</h2>
					<button type="button" class="gallery-close" aria-label="Close gallery">&times;</button>
				</header>
				<div class="gallery-body">
					<div class="images"></div>
					<button type="button" id="loadmore" class="gallery-loadmore">Load more</button>
				</div>
			</div>
		</div>

		<div id="history" class="history-modal" aria-hidden="true">
			<div class="history-backdrop"></div>
			<div class="history-dialog" role="dialog" aria-modal="true" aria-labelledby="history-title">
				<header class="gallery-header">
					<h2 id="history-title">History</h2>
					<button type="button" class="history-close gallery-close" aria-label="Close history">&times;</button>
				</header>
				<div class="history-body">
					<div class="history-list"></div>
					<p class="history-empty">No generations yet</p>
				</div>
			</div>
		</div>

		<div class="toast" aria-live="polite">
			<span class="spinner"></span>
			<div class="message"></div>
		</div>

		<div id="panel">
			<span class="highligth">Ctrl + Enter</span> = Generate
			<span class="floatright"><a rel="noopener noreferrer" target="_blank" href="http://ace.c9.io/">Ace</a> - The High Performance Code Editor</span>

			<div id="editor"></div>
		</div>

		<div class="overlay">
			<span class="spinner"></span>
		</div>

		<div id="three"></div>
		<div class="preview3d-controls">
			<button type="button" class="changescene">Change scene</button>
			<label class="fps-control" for="preview3d-fps">
				FPS
				<select id="preview3d-fps">
					<option value="15">15</option>
					<option value="30" selected>30</option>
					<option value="40">40</option>
					<option value="50">50</option>
					<option value="60">60</option>
					<option value="100">100</option>
					<option value="0">Max</option>
				</select>
				<span class="fps-actual" hidden></span>
			</label>
		</div>

		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"
			integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg=="
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r75/three.min.js"
			integrity="sha512-0Um5jj8EXynt5279TxN98RDLAUBs8FgpBcDZSiatk1FeD5f0XszFdpb04AS110QyQTNa7Kj0zoeZCIhTmVikug=="
			crossorigin="anonymous"
		></script>

		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.5.1/ace.min.js"
			integrity="sha512-Mh8jyZ+gBs2KDbpusvN/Ojk5WG/lD5elGKtij4ZahbFct3fAub8qRSvjllTcmMyhywB6Y0e7DpGmEs0oXbCVvQ=="

			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>
		<script

			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.5.1/theme-monokai.min.js"

			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>

		<script src="/generator/demo/js/index.js"></script>

	</body>
</html>
