<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Background Test</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/seamless-texture-generator@1.4.46/dist/tgen-with-presets.min.js"
      integrity="sha256-VJ/uA2yQQmGArbSMGW7sVWYwEsZRUdbo1a/3YUoHLcM="
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <script>
      var generator = tgen.init(256, 256);
      var texture = generator.render({
        preset: {
          name: "waves-cool",
          seed: null,
        },
      });

      $("body").css(
        "background-image",
        "url(" + texture.toCanvas().toDataURL("image/png") + ")"
      );
    </script>
  </body>
</html>
